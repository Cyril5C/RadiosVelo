<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radios Vélo">
  <title>Radios Vélo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="player">
    <img class="now-logo" id="current-logo" src="logos/fip.svg" alt="">
    <div class="now">
      <div class="now-label" id="status">Prêt</div>
      <div class="now-name" id="current">FIP Electro</div>
    </div>
    <button class="toggle" id="toggle" aria-label="Lecture">
      <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
  </header>

  <main class="grid" id="grid"></main>

  <footer class="tools">
    <button class="tool" id="edit">Réorganiser les radios</button>
    <button class="tool" id="reset" hidden>Ordre par défaut</button>
  </footer>

  <div class="overlay" id="overlay" hidden>
    <button class="overlay-btn" id="start">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span>Lancer <strong id="overlay-name">FIP Electro</strong></span>
    </button>
  </div>

  <audio id="audio" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
